<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>首美案場地圖</title>

<script src="https://unpkg.com/globe.gl@2.46.2/dist/globe.gl.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0d0b09;
    --surface-solid:#1a1611;
    --surface-2:#221c16;
    --ink:#f3efe8;
    --ink-dim:#9a9086;
    --ink-faint:#635b52;
    --line: rgba(255,255,255,.08);
    --line-strong: rgba(255,255,255,.14);
    --accent:#e08a2b;
    --accent-ink:#1a0f02;
    --shadow: 0 24px 60px -24px rgba(0,0,0,.7);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:var(--bg); }
  body{
    color:var(--ink);
    font-family:"IBM Plex Sans","PingFang TC","Noto Sans TC",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{ font-family:"IBM Plex Mono","IBM Plex Sans",monospace; font-variant-numeric:tabular-nums; }
  .display{ font-family:"Big Shoulders Display","IBM Plex Sans",sans-serif; font-weight:700; letter-spacing:.01em; text-transform:uppercase; }

  .app{ max-width:1180px; margin:0 auto; padding:22px 20px 56px; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding-bottom:18px; margin-bottom:26px; border-bottom:1px solid var(--line);
  }
  .topbar .mark{ display:flex; align-items:center; gap:9px; }
  .topbar .mark .dot{
    width:8px; height:8px; background:var(--accent);
  }
  .topbar .mark span{ font-family:"IBM Plex Sans",sans-serif; font-weight:600; font-size:14px; letter-spacing:.01em; }
  .demo-pill{
    font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.06em;
    padding:4px 9px; border:1px solid rgba(224,138,43,.4);
    color:var(--accent); background:rgba(224,138,43,.08); white-space:nowrap;
  }

  .hero{ max-width:640px; margin-bottom:22px; }
  .hero .eyebrow{
    font-family:"IBM Plex Mono",monospace;
    font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint);
    margin-bottom:10px;
  }
  .hero h1{ font-size:clamp(32px,5vw,46px); line-height:1; margin:0 0 12px; }
  .hero p{ color:var(--ink-dim); font-size:14.5px; line-height:1.7; margin:0 0 10px; max-width:52ch; }
  .hero .quick{ font-size:12.5px; color:var(--ink-faint); display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .hero .quick b{ color:var(--ink); font-weight:600; }
  .hero .quick .sep{ opacity:.5; }

  /* map */
  .map-card{
    position:relative; border-radius:6px; border:1px solid var(--line-strong);
    box-shadow:var(--shadow); overflow:hidden; margin-bottom:20px;
    height:min(72vh, 620px); background:#04030a;
  }
  #map{ width:100%; height:100%; cursor:grab; }
  #map:active{ cursor:grabbing; }

  .pin-badge{
    display:flex; align-items:center; justify-content:center; border-radius:50%;
    color:var(--accent-ink); font-family:"IBM Plex Mono",monospace; font-weight:700;
    border:2px solid rgba(13,11,9,.55); cursor:pointer;
    transition: transform .15s ease, box-shadow .15s ease;
    transform:translate(-50%,-50%);
    /* globe.gl's HTML-marker layer sits on a wrapper with pointer-events:none
       (so it doesn't block dragging the globe) — badges must opt back in or clicks pass through */
    pointer-events:auto;
  }
  .pin-badge:hover{ transform:translate(-50%,-50%) scale(1.08); }
  .pin-badge.selected{
    transform:translate(-50%,-50%) scale(1.2);
    box-shadow:0 0 0 3px #fff, 0 0 0 5px var(--bg), 0 0 18px var(--pin-color, currentColor);
    z-index:1000 !important;
  }

  .region-label{
    transform:translate(-50%,-50%);
    font-family:"IBM Plex Sans","PingFang TC","Noto Sans TC",sans-serif;
    font-size:12px; letter-spacing:.04em; color:rgba(255,255,255,.85);
    text-shadow:0 1px 4px rgba(0,0,0,.9), 0 0 10px rgba(0,0,0,.6);
    pointer-events:none; white-space:nowrap;
  }

  .reset-float{
    top:14px; right:14px; z-index:600; padding:0; pointer-events:auto;
  }
  .reset-float button{
    width:34px; height:34px; background:none; border:none; color:var(--ink);
    font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .reset-float button:hover{ background:rgba(255,255,255,.06); }

  .float-card{
    position:absolute; background:rgba(13,11,9,.88);
    border:1px solid var(--line-strong); border-top:2px solid var(--accent);
    box-shadow:var(--shadow); z-index:600; pointer-events:none;
  }
  .stat-float{ top:14px; left:14px; padding:12px 16px; display:flex; gap:18px; }
  .stat-float .s{ display:flex; flex-direction:column; }
  .stat-float .s .l{ font-size:10px; color:var(--ink-faint); letter-spacing:.04em; }
  .stat-float .s .v{ font-family:"IBM Plex Mono",monospace; font-weight:700; font-size:16px; margin-top:1px; }
  .stat-float .s .v small{ font-size:10.5px; font-weight:400; color:var(--ink-dim); }

  .legend-float{
    bottom:14px; left:14px; padding:10px 14px; display:flex; flex-direction:column; gap:7px;
  }
  .legend-float .lt{ font-size:10px; color:var(--ink-faint); letter-spacing:.06em; text-transform:uppercase; margin-bottom:2px; }
  .legend-float .item{ display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--ink-dim); }
  .legend-float .sw{ width:9px; height:9px; border-radius:50%; flex:none; }

  /* lower layout */
  .layout{ display:grid; grid-template-columns:.85fr 1.15fr; gap:16px; align-items:start; }
  @media (max-width:820px){ .layout{ grid-template-columns:1fr; } }

  .panel{
    background:var(--surface-solid); border:1px solid var(--line-strong); border-radius:6px;
    box-shadow:var(--shadow); overflow:hidden;
  }
  .panel-head{ padding:14px 16px; border-bottom:1px solid var(--line); font-size:12.5px; color:var(--ink-dim); }
  .panel-head b{ color:var(--ink); font-weight:600; }

  .list-row{
    display:flex; align-items:center; gap:11px; padding:13px 16px; border-bottom:1px solid var(--line); cursor:pointer;
  }
  .list-row:last-child{ border-bottom:none; }
  .list-row:hover{ background:rgba(255,255,255,.03); }
  .list-row.active{ background:rgba(224,138,43,.10); border-left:2px solid var(--accent); }
  .list-row .dot{ width:8px; height:8px; border-radius:50%; flex:none; }
  .list-row .meta{ flex:1; min-width:0; }
  .list-row .meta .name{ font-size:13.5px; font-weight:600; }
  .list-row .meta .sub{ font-size:11px; color:var(--ink-faint); margin-top:1px; }
  .list-row .cap{ font-family:"IBM Plex Mono",monospace; font-size:12.5px; color:var(--ink-dim); text-align:right; }
  .list-row .cap b{ color:var(--ink); font-weight:700; }

  .detail{ padding:18px; }
  .empty{ color:var(--ink-faint); font-size:13px; padding:48px 16px; text-align:center; line-height:1.8; }
  .aerial{ aspect-ratio:16/9; border-radius:4px; position:relative; overflow:hidden; border:1px solid var(--line-strong); }
  .aerial .grid{ position:absolute; inset:0; }
  .aerial .shade{ position:absolute; inset:0; background:linear-gradient(180deg, transparent 40%, rgba(6,9,16,.75) 100%); }
  .aerial .tag{
    position:absolute; left:10px; bottom:10px; font-family:"IBM Plex Mono",monospace; font-size:10px;
    background:rgba(8,12,22,.7); border:1px solid rgba(255,255,255,.12); color:#fff; padding:4px 8px;
  }
  .detail h3{ font-family:"Big Shoulders Display",sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:.01em; font-size:24px; margin:14px 0 2px; }
  .detail .county{ font-size:12px; color:var(--ink-faint); margin-bottom:14px; }
  .badge-line{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  .type-badge{ font-size:11px; padding:4px 10px; border:1px solid var(--line-strong); color:var(--ink-dim); }
  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px; }
  .stat{ background:var(--surface-2); border-radius:4px; padding:10px 12px; }
  .stat .label{ font-size:10.5px; color:var(--ink-faint); }
  .stat .value{ font-family:"IBM Plex Mono",monospace; font-weight:700; font-size:16.5px; margin-top:2px; }
  .stat .value small{ font-size:11px; font-weight:400; color:var(--ink-dim); }
  .note{ font-size:11.5px; color:var(--ink-faint); line-height:1.6; border-top:1px dashed var(--line); padding-top:10px; margin-top:2px; }

  footer.foot{ margin-top:26px; font-size:11px; color:var(--ink-faint); text-align:center; }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="mark"><span class="dot"></span><span>首美能源</span></div>
    <span class="demo-pill">DEMO · 資料為示範用</span>
  </div>

  <div class="hero">
    <div class="eyebrow">全台案場</div>
    <h1 class="display">案場總覽</h1>
    <p>拖曳旋轉、滾輪縮放。點選圖釘查看容量、發電量與現場畫面。</p>
    <div class="quick" id="quickStats"></div>
  </div>

  <div class="map-card">
    <div id="map"></div>
    <div class="float-card stat-float" id="statFloat"></div>
    <div class="float-card legend-float" id="legendFloat"></div>
    <div class="float-card reset-float"><button id="resetView" title="回到台灣">⟲</button></div>
  </div>

  <div class="layout">
    <div class="panel">
      <div class="panel-head"><b>案場清單</b> · 依容量排序</div>
      <div id="listView"></div>
    </div>
    <div class="panel" id="detailPanel">
      <div class="panel-head"><b>案場詳情</b></div>
      <div class="detail" id="detailView"></div>
    </div>
  </div>

  <footer class="foot">示意用 Demo · 地球影像：NASA Earth Observatory（夜間燈光）· 國界資料：Natural Earth · 案場數據與現場畫面皆為範例，正式版將替換為實際案場資訊</footer>
</div>

<script>
(function(){
  'use strict';

  var TYPES = {
    ground: { label:'地面型', hex:'#e08a2b' },
    water:  { label:'水面型', hex:'#5f7f99' },
    roof:   { label:'屋頂型', hex:'#93789c' }
  };

  // fill in real sites here — one object per case, same shape as this example:
  // { id:'unique-id', name:'案場名稱', county:'行政區', type:'ground'|'water'|'roof',
  //   year:2024, capacity:18 /* MW */, annual:21000 /* MWh */, lat:23.87, lon:120.10 }
  var sites = [
  ].sort(function(a,b){ return b.capacity - a.capacity; });

  var HOUSEHOLD_MWH = 3.0;   // 台灣家庭年均用電概估 (MWh)
  var GRID_FACTOR = 0.495;   // 台灣電網排碳係數概估 (tCO2/MWh)

  var totalCapacity = sites.reduce(function(s,d){ return s+d.capacity; }, 0);
  var totalAnnual = sites.reduce(function(s,d){ return s+d.annual; }, 0);

  document.getElementById('quickStats').innerHTML =
    '<b>' + sites.length + '</b> 案場<span class="sep">·</span>' +
    '<b>' + totalCapacity + '</b> MWp<span class="sep">·</span>' +
    '<b>' + totalAnnual.toLocaleString() + '</b> MWh/年';

  document.getElementById('statFloat').innerHTML =
    '<div class="s"><div class="l">案場數</div><div class="v mono">' + sites.length + ' <small>sites</small></div></div>' +
    '<div class="s"><div class="l">總裝置容量</div><div class="v mono">' + totalCapacity + ' <small>MWp</small></div></div>';

  document.getElementById('legendFloat').innerHTML =
    '<div class="lt">案場類型</div>' +
    Object.keys(TYPES).map(function(key){
      var t = TYPES[key];
      return '<div class="item"><span class="sw" style="background:' + t.hex + '"></span>' + t.label + '</div>';
    }).join('');

  // ---- 3D globe ----
  var TAIWAN_VIEW = { lat:23.7, lng:121.0, altitude:0.45 };
  var MIN_ALTITUDE = 0.12; // closest the globe ever zooms — see controls.minDistance below

  var maxCap = sites.length ? Math.max.apply(null, sites.map(function(s){ return s.capacity; })) : 1;
  var MIN_BADGE_PX = 30, MAX_BADGE_PX = 54;
  function badgeSize(s){ return Math.round(MIN_BADGE_PX + (s.capacity/maxCap) * (MAX_BADGE_PX-MIN_BADGE_PX)); }

  var markersById = {};

  function buildSiteBadge(s){
    var t = TYPES[s.type];
    var size = badgeSize(s);
    var el = document.createElement('div');
    el.className = 'pin-badge mono';
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.fontSize = Math.max(10, size*0.34) + 'px';
    el.style.background = t.hex;
    el.style.setProperty('--pin-color', t.hex);
    el.textContent = s.capacity;
    el.title = s.name + ' · ' + t.label + ' · ' + s.capacity + ' MWp';
    // stopPropagation so the click doesn't also register as a drag-start on the globe underneath
    el.addEventListener('click', function(ev){ ev.stopPropagation(); selectSite(s.id); });
    markersById[s.id] = el;
    return el;
  }

  function buildRegionLabel(r){
    var el = document.createElement('div');
    el.className = 'region-label';
    el.textContent = r.text;
    return el;
  }

  // reference labels for nearby countries/seas — the globe otherwise reads as an
  // unlabelled blob at a glance, even once real coastlines are visible.
  // Rendered through the same HTML-marker layer as the site badges (not globe.gl's
  // separate .labelsData layer — that one draws via canvas sprite text with a font
  // that has no CJK glyphs, so Chinese text there silently renders as "???").
  var REGION_LABELS = [
    { kind:'region', text:'中國', lat:30,   lon:111   },
    { kind:'region', text:'日本', lat:36.5, lon:138.5 },
    { kind:'region', text:'韓國', lat:36.2, lon:127.8 },
    { kind:'region', text:'菲律賓', lat:12.5, lon:122.5 },
    { kind:'region', text:'太平洋', lat:20,   lon:138   }
  ];

  var HTML_MARKERS = sites.concat(REGION_LABELS);

  function buildMarker(d){
    return d.kind === 'region' ? buildRegionLabel(d) : buildSiteBadge(d);
  }

  // NOTE: .htmlElementsData(...) must be the LAST call in this chain. globe.gl reads
  // the current htmlLat/htmlLng/htmlElement accessors at the moment the data is set —
  // setting data before the accessors silently renders zero markers (no error thrown).
  var mapEl = document.getElementById('map');
  var world = Globe()(mapEl)
    // earth-night.jpg (city-light texture) looked wrong here: it's an emissive-style
    // map, but three-globe lights the globe like a normal photo (Phong + directional
    // light), so the night lights got lit/shaded unevenly instead of just glowing.
    // earth-blue-marble.jpg is a real diffuse photo texture, built for this lighting.
    .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
    .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
    .backgroundColor('#00000000')
    .showAtmosphere(true)
    .atmosphereColor('#f2c98a')
    .atmosphereAltitude(0.18)
    .width(mapEl.clientWidth)
    .height(mapEl.clientHeight)
    .polygonsData([])
    .polygonCapColor(function(){ return 'rgba(0,0,0,0)'; })
    .polygonSideColor(function(){ return 'rgba(0,0,0,0)'; })
    .polygonStrokeColor(function(){ return 'rgba(255,244,224,.4)'; })
    .polygonAltitude(0.006)
    .htmlLat('lat')
    .htmlLng('lon')
    .htmlAltitude(0.01)
    .htmlElement(buildMarker)
    .htmlElementsData(HTML_MARKERS);

  // country borders load separately (~480KB) so the globe itself isn't blocked on it
  fetch('https://unpkg.com/three-globe/example/country-polygons/ne_110m_admin_0_countries.geojson')
    .then(function(res){ return res.json(); })
    .then(function(countries){ world.polygonsData(countries.features); })
    .catch(function(){ /* borders are decorative — globe still works without them */ });

  // opening shot: start pulled back so the whole globe is visible, then fly in to Taiwan
  world.pointOfView({ lat:15, lng:95, altitude:2.6 }, 0);
  var controls = world.controls();
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.6;
  controls.enableDamping = true;
  // the globe is one fixed-resolution world texture, not map tiles that sharpen on
  // zoom — past this distance it just magnifies the same pixels and looks blurry,
  // so stop scroll-zoom here rather than let people zoom into a smear
  controls.minDistance = 100 * (1 + MIN_ALTITUDE);

  setTimeout(function(){
    world.pointOfView(TAIWAN_VIEW, 2600);
    setTimeout(function(){ controls.autoRotate = false; }, 2700);
  }, 900);

  window.addEventListener('resize', function(){
    world.width(mapEl.clientWidth).height(mapEl.clientHeight);
  });

  document.getElementById('resetView').addEventListener('click', function(){
    controls.autoRotate = false;
    world.pointOfView(TAIWAN_VIEW, 1200);
  });

  // ---- list ----
  var listView = document.getElementById('listView');
  listView.innerHTML = sites.length ? sites.map(function(s){
    var t = TYPES[s.type];
    return '<div class="list-row" data-id="' + s.id + '">' +
      '<span class="dot" style="background:' + t.hex + '"></span>' +
      '<div class="meta"><div class="name">' + s.name + '</div><div class="sub">' + s.county + ' · ' + t.label + '</div></div>' +
      '<div class="cap"><b>' + s.capacity + '</b> MW</div>' +
    '</div>';
  }).join('') : '<div class="empty">尚未加入案場資料</div>';
  listView.querySelectorAll('.list-row').forEach(function(row){
    row.addEventListener('click', function(){ selectSite(row.getAttribute('data-id')); });
  });

  // ---- selection + detail ----
  var detailEl = document.getElementById('detailView');

  function selectSite(id){
    var s = sites.filter(function(d){ return d.id === id; })[0];
    if (!s) return;

    Object.keys(markersById).forEach(function(key){
      markersById[key].classList.toggle('selected', key === id);
    });
    document.querySelectorAll('.list-row').forEach(function(row){
      row.classList.toggle('active', row.getAttribute('data-id') === id);
    });

    renderDetail(s);
    controls.autoRotate = false;
    world.pointOfView({ lat:s.lat, lng:s.lon, altitude:MIN_ALTITUDE }, 900);

    var panel = document.getElementById('detailPanel');
    panel.style.boxShadow = '0 0 0 2px var(--accent), var(--shadow)';
    setTimeout(function(){ panel.style.boxShadow = ''; }, 900);
    if (window.innerWidth < 860) {
      panel.scrollIntoView({ behavior:'smooth', block:'start' });
    }
  }

  function renderDetail(s){
    var t = TYPES[s.type];
    var households = Math.round(s.annual / HOUSEHOLD_MWH);
    var co2 = Math.round(s.annual * GRID_FACTOR);
    detailEl.innerHTML =
      '<div class="aerial" style="background:linear-gradient(160deg, ' + t.hex + '22, #0d0b09 70%)">' +
        '<div class="grid" style="background-image:repeating-linear-gradient(100deg, ' + t.hex + '55 0 12px, ' + t.hex + '22 12px 14px), repeating-linear-gradient(10deg, transparent 0 20px, rgba(0,0,0,.28) 20px 22px); background-blend-mode:screen;"></div>' +
        '<div class="shade"></div>' +
        '<span class="tag">示意畫面 · 待替換實拍</span>' +
      '</div>' +
      '<h3 class="display">' + s.name + '</h3>' +
      '<div class="county">' + s.county + ' · ' + s.year + ' 年完工</div>' +
      '<div class="badge-line"><span class="type-badge">' + t.label + '</span><span class="type-badge">併網第 ' + (new Date().getFullYear() - s.year) + ' 年</span></div>' +
      '<div class="stat-grid">' +
        '<div class="stat"><div class="label">裝置容量</div><div class="value mono">' + s.capacity + ' <small>MW</small></div></div>' +
        '<div class="stat"><div class="label">年發電量</div><div class="value mono">' + s.annual.toLocaleString() + ' <small>MWh</small></div></div>' +
        '<div class="stat"><div class="label">約當供電戶數</div><div class="value mono">' + households.toLocaleString() + ' <small>戶/年</small></div></div>' +
        '<div class="stat"><div class="label">約當減碳量</div><div class="value mono">' + co2.toLocaleString() + ' <small>tCO2/年</small></div></div>' +
      '</div>' +
      '<div class="note">範例數據，依台灣家庭年均用電約3 MWh、電網排碳係數約0.495 tCO2/MWh 概估，正式版建議改用實測發電數據。</div>';
  }

  detailEl.innerHTML = '<div class="empty">從地圖圖釘或左側清單<br>選一個案場查看詳細資訊</div>';
})();
</script>
</body>
</html>
